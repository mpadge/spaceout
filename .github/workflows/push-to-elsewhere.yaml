# HOWTO generate personal token on codeberg:
#   1. Personal settings -> Applications -> Generate new token
#   2. Grant access to repo read/write
#
# TODO on github:
# Store all necessary variables as secrets, including passwords with secret
# names as specified below:
# - UNAME, EMAIL for git config
# - CODEBERG for codeberg.org token
# - CODEFLOW for codeflow.com token

name: push-to-elsewhere

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  push-to-elsehwere:
    runs-on: ubuntu-latest

    # will only push *from* main
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
    - uses: actions/checkout@v4

    - name: Git setup
      run: |
          git config --global user.name "mpadge"
          git config --global user.email "mark.padgham@email.com"
          git clone https://github.com/mpadge/spaceout.git
          git fetch --unshallow origin
          git remote add codeberg https://${{secrets.UNAME}}:${{secrets.CODEBERG}}@codeberg.org/mpadge/spaceout.git
          git push --tags codeberg main
          git remote add codefloe https://${{secrets.UNAME}}:${{secrets.CODEFLOE}}@codefloe.com/mpadge/spaceout.git
          git push --tags codefloe main
